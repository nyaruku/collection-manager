<template id="tmpl-beatmap-list">
    <div class="beatmap-list"></div>
</template>

<template id="tmpl-beatmap-header">
    <div class="beatmap-header" oncontextmenu="showColumnMenu(event)"></div>
</template>

<template id="tmpl-beatmap-header-col">
    <div class="beatmap-col sortable-header"></div>
</template>

<template id="tmpl-beatmap-row">
    <div class="beatmap-row">
        <div class="beatmap-col" data-col="title"></div>
        <div class="beatmap-col text-muted" data-col="artist"></div>
        <div class="beatmap-col text-muted" data-col="difficulty"></div>
        <div class="beatmap-col text-muted" data-col="mapper"></div>
        <div class="beatmap-col text-warning" data-col="stars"></div>
        <div class="beatmap-col" data-col="id"></div>
        <div class="beatmap-col" data-col="setid"></div>
        <div class="beatmap-col font-monospace text-muted" data-col="md5"></div>
    </div>
</template>

<template id="tmpl-collection-header">
    <div class="px-2 py-1 collection-header d-flex align-items-center">
        <span data-slot="name" class="fw-semibold"></span>
        <span data-slot="count" class="text-muted ms-2"></span>
    </div>
</template>

<template id="tmpl-collection-item">
    <button type="button" class="list-group-item list-group-item-action py-1 px-2 border-0 rounded-0">
        <div class="d-flex justify-content-between align-items-center gap-1">
            <span data-slot="name" class="text-truncate"></span>
            <span data-slot="count" class="badge bg-dark text-white fw-normal flex-shrink-0 small badge-count"></span>
        </div>
    </button>
</template>
